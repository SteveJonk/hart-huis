name: Deploy Sanity Studio

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Eén deploy tegelijk; een nieuwe push annuleert een lopende run.
concurrency:
  group: deploy-sanity-studio
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-hart-huis
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-hart-huis/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build studio
        run: npm run build

      # --yes: unattended, anders vraagt de CLI om een studio-hostname en
      # blijft de run hangen. De hostname komt van de al gedeployde studio.
      - name: Deploy to Sanity
        run: npm run deploy -- --yes
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
