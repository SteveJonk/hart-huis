name: Deploy Sanity Studio

on:
  push:
    branches:
      - main
    paths:
      - "studio-hart-huis/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-hart-huis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-hart-huis/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build studio
        run: npm run build

      - name: Deploy to Sanity
        run: npm run deploy -- --no-bust-cache
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
