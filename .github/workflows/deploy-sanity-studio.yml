name: Deploy Sanity Studio

on:
  push:
    branches:
      - main
    paths:
      - "studio-hart-huis/**"
      # De workflow zelf, zodat een wijziging hieraan meteen getest wordt.
      - ".github/workflows/deploy-sanity-studio.yml"
  workflow_dispatch:

# Eén deploy tegelijk; een nieuwe push annuleert een lopende run.
concurrency:
  group: deploy-sanity-studio
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-hart-huis

    # Vite bakt `process.env.SANITY_STUDIO_*` bij het bouwen in de bundle, dus
    # deze moeten hier staan en niet pas bij het deployen. Op job-niveau zodat
    # zowel `sanity build` als de herbouw binnen `sanity deploy` ze meekrijgt.
    # Lokaal komen ze uit studio-hart-huis/.env — die staat in .gitignore.
    env:
      SANITY_STUDIO_SCRAPER_URL: ${{ vars.SANITY_STUDIO_SCRAPER_URL }}
      SANITY_STUDIO_SCRAPER_SECRET: ${{ secrets.SANITY_STUDIO_SCRAPER_SECRET }}
      SANITY_STUDIO_REALWORKS_URL: = ${{ vars.SANITY_STUDIO_REALWORKS_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-hart-huis/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Zonder deze twee bouwt de studio gewoon door en zegt de Funda-tool
      # daarna "Nog niet ingesteld" — een stille fout die je pas in de
      # gedeployde studio ziet. Liever hier hard falen.
      - name: Check studio env vars
        run: |
          missing=0
          for var in SANITY_STUDIO_SCRAPER_URL SANITY_STUDIO_SCRAPER_SECRET; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is leeg. Zet hem bij Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Build studio
        run: npm run build

      # --yes: unattended, anders vraagt de CLI om een studio-hostname en
      # blijft de run hangen.
      # --url: de studio waar naartoe gedeployd wordt, uit de repository
      # variable SANITY_STUDIO_HOSTNAME (Settings > Secrets and variables >
      # Actions > Variables). Geen secret — de hostname staat toch publiek.
      # Is de variable leeg, dan valt de CLI terug op de al gedeployde studio.
      - name: Deploy to Sanity
        run: npm run deploy -- --yes ${STUDIO_HOSTNAME:+--url "$STUDIO_HOSTNAME"}
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          STUDIO_HOSTNAME: ${{ vars.SANITY_STUDIO_HOSTNAME }}
          SANITY_STUDIO_REALWORKS_URL: ${{ vars.SANITY_STUDIO_REALWORKS_URL }}
